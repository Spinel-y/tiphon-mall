<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>主人验证 · 提丰</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #fef9e8 0%, #fff3e0 100%);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -120px; right: -120px;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(249,115,22,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -80px; left: -80px;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(245,158,11,0.07) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .login-container {
            background: rgba(255,250,240,0.92);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 30px 60px -16px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.03);
            padding: 3rem 2.5rem 2.5rem;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,230,180,0.5);
            text-align: center;
            animation: fadeSlideUp 0.5s ease-out;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-avatar {
            width: 90px; height: 90px;
            border-radius: 40px;
            background: linear-gradient(135deg, #f97316, #f59e0b);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.2rem;
            box-shadow: 0 12px 28px rgba(249,115,22,0.3);
            position: relative;
        }
        .login-avatar i { font-size: 2.8rem; color: white; }
        .login-avatar .ear {
            position: absolute;
            top: -14px;
            width: 0; height: 0;
        }
        .login-avatar .ear.left {
            left: 10px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #f97316;
            transform: rotate(-20deg);
        }
        .login-avatar .ear.right {
            right: 10px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #f59e0b;
            transform: rotate(20deg);
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #b45309, #d97706);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
            letter-spacing: -0.3px;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: #c0845c;
            margin-bottom: 1.8rem;
            display: flex; align-items: center; justify-content: center;
            gap: 6px;
        }
        .login-subtitle i { font-size: 0.7rem; color: #f97316; }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #b45309;
            margin-bottom: 0.4rem;
            display: flex; align-items: center; gap: 6px;
        }
        .form-group label i { color: #f97316; width: 16px; text-align: center; }

        .input-field {
            width: 100%;
            padding: 0.85rem 1.1rem;
            border-radius: 1rem;
            border: 1.5px solid #ffe0b5;
            background: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #422006;
            outline: none;
            transition: all 0.25s;
        }
        .input-field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249,115,22,0.12);
        }
        .input-field::placeholder { color: #d9a87c; }

        .input-field.shake {
            animation: shake 0.4s ease-in-out;
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.78rem;
            margin-top: 0.35rem;
            display: none;
            align-items: center; gap: 4px;
        }
        .error-msg.show { display: flex; }

        .login-btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 1.5rem;
            border: none;
            background: linear-gradient(135deg, #f97316, #f59e0b);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.25s;
            box-shadow: 0 6px 18px rgba(249,115,22,0.28);
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(249,115,22,0.35); }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 登录 / 注册切换 */
        .auth-tabs {
            display: flex;
            background: #fff3e0;
            border-radius: 1.2rem;
            padding: 4px;
            margin-bottom: 1.4rem;
            gap: 4px;
        }
        .auth-tab {
            flex: 1;
            padding: 0.6rem 0;
            border: none;
            background: transparent;
            border-radius: 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: #c0845c;
            cursor: pointer;
            transition: all 0.25s;
        }
        .auth-tab.active {
            background: white;
            color: #ea580c;
            box-shadow: 0 2px 8px rgba(249,115,22,0.15);
        }
        .auth-form { display: none; text-align: left; }
        .auth-form.active { display: block; }
        .form-error {
            display: none;
            align-items: center;
            gap: 6px;
            margin: 0.2rem 0 0.4rem;
            padding: 0.6rem 0.9rem;
            border-radius: 0.8rem;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .form-error.show { display: flex; }
        .form-hint {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #c0845c;
        }
        .form-hint a { color: #ea580c; font-weight: 600; cursor: pointer; }
        .form-hint a:hover { text-decoration: underline; }

        .login-footer {
            margin-top: 1.2rem;
            font-size: 0.72rem;
            color: #c0845c;
            display: flex; align-items: center; justify-content: center;
            gap: 6px;
        }

        .paw-prints {
            display: flex; gap: 6px;
            justify-content: center; margin-top: 1rem;
        }
        .paw-prints i {
            color: #fdba74;
            font-size: 0.6rem;
            animation: pawFade 2s ease-in-out infinite;
        }
        .paw-prints i:nth-child(2) { animation-delay: 0.3s; }
        .paw-prints i:nth-child(3) { animation-delay: 0.6s; }
        .paw-prints i:nth-child(4) { animation-delay: 0.9s; }
        @keyframes pawFade {
            0%,100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
        }

        @media (max-width: 480px) {
            .login-container { padding: 2rem 1.5rem 1.8rem; border-radius: 2rem; }
            .login-avatar { width: 70px; height: 70px; border-radius: 30px; }
            .login-avatar i { font-size: 2.2rem; }
            .login-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-avatar">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <i class="fas fa-cat"></i>
    </div>

    <div class="login-title">主人身份验证</div>
    <div class="login-subtitle">
        <i class="fas fa-paw"></i> 提丰只认主人一个人哦喵~ <i class="fas fa-paw" style="transform:scaleX(-1);"></i>
    </div>

    <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin">登录</button>
        <button type="button" class="auth-tab" id="tabRegister">注册</button>
    </div>

    <!-- 登录 -->
    <form id="loginForm" class="auth-form active" autocomplete="off">
        <div class="form-group">
            <label><i class="fas fa-user"></i> 用户名</label>
            <input type="text" class="input-field" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> 密码</label>
            <input type="password" class="input-field" id="loginPassword" placeholder="请输入密码喵~" autocomplete="current-password">
        </div>

        <div class="form-error" id="loginError"><i class="fas fa-exclamation-circle"></i><span></span></div>

        <button type="submit" class="login-btn" id="loginBtn">
            <i class="fas fa-door-open"></i> 登录进入
        </button>
        <p class="form-hint">还没有账号？<a id="toRegister">注册一个喵 →</a></p>
    </form>

    <!-- 注册 -->
    <form id="registerForm" class="auth-form" autocomplete="off">
        <div class="form-group">
            <label><i class="fas fa-user"></i> 用户名</label>
            <input type="text" class="input-field" id="regUsername" placeholder="起个用户名（登录用）" autocomplete="username">
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> 密码</label>
            <input type="password" class="input-field" id="regPassword" placeholder="至少 6 位密码" autocomplete="new-password">
        </div>

        <div class="form-group">
            <label><i class="fas fa-id-card"></i> 昵称</label>
            <input type="text" class="input-field" id="regNickname" placeholder="提丰该怎么称呼你喵？" autocomplete="nickname">
        </div>

        <div class="form-group">
            <label><i class="fas fa-phone"></i> 手机号（选填）</label>
            <input type="tel" class="input-field" id="regPhone" placeholder="方便找回账号喵" autocomplete="tel">
        </div>

        <div class="form-error" id="registerError"><i class="fas fa-exclamation-circle"></i><span></span></div>

        <button type="submit" class="login-btn" id="registerBtn">
            <i class="fas fa-paw"></i> 注册并进入
        </button>
        <p class="form-hint">已有账号？<a id="toLogin">去登录 →</a></p>
    </form>

    <div class="paw-prints">
        <i class="fas fa-paw"></i><i class="fas fa-paw"></i>
        <i class="fas fa-paw"></i><i class="fas fa-paw"></i>
    </div>

    <div class="login-footer">
        <i class="fas fa-shield-alt"></i> 提丰智能助手 · 仅限主人访问
    </div>
</div>

<script>
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const loginError = document.getElementById('loginError');
const registerError = document.getElementById('registerError');
const loginBtn = document.getElementById('loginBtn');
const registerBtn = document.getElementById('registerBtn');

// 切换登录 / 注册
function switchTab(tab) {
    const isLogin = tab === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabRegister.classList.toggle('active', !isLogin);
    loginForm.classList.toggle('active', isLogin);
    registerForm.classList.toggle('active', !isLogin);
    hideError(loginForm);
    hideError(registerForm);
    (isLogin ? document.getElementById('loginUsername') : document.getElementById('regUsername')).focus();
}

function showError(form, msg) {
    const box = form.querySelector('.form-error');
    box.querySelector('span').innerText = msg;
    box.classList.add('show');
}

function hideError(form) {
    form.querySelector('.form-error').classList.remove('show');
}

function shakeInput(input) {
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 450);
}

function setBusy(btn, busy, text) {
    btn.disabled = busy;
    btn.innerHTML = busy ? '<i class="fas fa-spinner fa-spin"></i> 喵喵验证中…' : text;
}

// 统一 POST，错误取后端 message
async function postJSON(url, body) {
    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* 非 JSON */ }
    if (!res.ok) {
        const fallback = res.status === 401 ? '用户名或密码不对喵~' : ('请求失败喵（' + res.status + '）');
        throw new Error((data && data.message) || fallback);
    }
    return data;
}

function enterApp(doneBtn, doneText) {
    doneBtn.disabled = true;
    doneBtn.innerHTML = doneText;
    doneBtn.style.background = 'linear-gradient(135deg, #16a34a, #22c55e)';
    setTimeout(() => { window.location.href = '/index.html'; }, 500);
}

tabLogin.addEventListener('click', () => switchTab('login'));
tabRegister.addEventListener('click', () => switchTab('register'));
document.getElementById('toRegister').addEventListener('click', () => switchTab('register'));
document.getElementById('toLogin').addEventListener('click', () => switchTab('login'));

// 登录
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError(loginForm);
    const usernameInput = document.getElementById('loginUsername');
    const passwordInput = document.getElementById('loginPassword');
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    if (!username || !password) {
        showError(loginForm, '用户名和密码都要填喵~');
        shakeInput(!username ? usernameInput : passwordInput);
        return;
    }

    setBusy(loginBtn, true);
    try {
        await postJSON('/api/auth/login', { username, password });
        setBusy(loginBtn, false, '登录');
        enterApp(loginBtn, '<i class="fas fa-check-circle"></i> 验证成功，欢迎回来喵~');
    } catch (err) {
        setBusy(loginBtn, false, '<i class="fas fa-door-open"></i> 登录进入');
        showError(loginForm, err.message);
        shakeInput(passwordInput);
    }
});

// 注册
registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError(registerForm);
    const usernameInput = document.getElementById('regUsername');
    const passwordInput = document.getElementById('regPassword');
    const nicknameInput = document.getElementById('regNickname');
    const phoneInput = document.getElementById('regPhone');
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    const nickname = nicknameInput.value.trim();
    const phone = phoneInput.value.trim();

    if (!username || !password || !nickname) {
        showError(registerForm, '用户名、密码、昵称都要填喵~');
        shakeInput(!username ? usernameInput : (!password ? passwordInput : nicknameInput));
        return;
    }
    if (password.length < 6) {
        showError(registerForm, '密码至少 6 位喵~');
        shakeInput(passwordInput);
        return;
    }

    setBusy(registerBtn, true);
    try {
        const payload = { username, password, nickname };
        if (phone) payload.phone = phone;
        await postJSON('/api/auth/register', payload);
        setBusy(registerBtn, false, '注册');
        enterApp(registerBtn, '<i class="fas fa-check-circle"></i> 注册成功，欢迎加入喵~');
    } catch (err) {
        setBusy(registerBtn, false, '<i class="fas fa-paw"></i> 注册并进入');
        showError(registerForm, err.message);
        shakeInput(usernameInput);
    }
});

// 已登录 → 直接进会话
(async () => {
    try {
        const res = await fetch('/api/auth/me');
        if (res.ok) { window.location.replace('/index.html'); return; }
    } catch (e) { /* 服务未启动时留在登录页 */ }
    document.getElementById('loginUsername').focus();
})();
</script>

</body>
</html>
