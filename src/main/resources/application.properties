spring.application.name=tiphon-mall
server.port=8899

# ── 私密配置（API Key 等） ────────────────────────────────────
# 项目根目录的 application-secret.properties 已被 .gitignore 排除，不会进仓库。
# 首次使用：复制 application-secret.properties.example 改名再填；
# 也可以直接启动应用，在会话页左下角「设置」里填 Key，保存后自动写回。
spring.config.import=optional:file:./application-secret.properties

# ── 数据库（默认 MySQL，想跳过装库就用 h2 profile） ──────────
# 默认值可以用环境变量 DB_URL / DB_USER / DB_PASSWORD 覆盖，
# 也可以在 application-secret.properties 里写同名 spring.datasource.* 覆盖。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tiphon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:tiphon_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

server.error.include-message=always
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB