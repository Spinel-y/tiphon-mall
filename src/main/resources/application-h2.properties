# H2 演示模式：不装 MySQL 也能跑起来（数据落在 ./data/tiphon.mv.db）
# 用法：mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:file:./data/tiphon;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect